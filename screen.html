<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c08a44" />
    <meta name="robots" content="noindex" />
    <title>PartyBoard — 会場スクリーン</title>
    <!-- 地の質感 (生成物: node scripts/generate-textures.mjs) -->
    <link rel="stylesheet" href="./textures.css" />
    <link rel="stylesheet" href="./board.css" />
  </head>
  <body>
    <!-- コルク地と木枠 (画像を使わずCSSだけで描く) -->
    <div class="board" id="board" aria-live="polite"></div>
    <div class="frame"></div>

    <!-- 左上: イベント名 -->
    <div class="corner plate" id="plate">
      <h1 id="title">読み込み中…</h1>
      <div class="sub"><span id="date"></span> <span id="count"></span></div>
    </div>

    <!-- 右下: ゲストの入り口。QRは置かない (下の board.css の説明を参照) -->
    <div class="corner invite" id="invite">
      <span class="call">写真を送る</span>
      <span class="url" id="join-url"></span>
      <span class="code" id="code"></span>
    </div>

    <!-- アイドル時のスライドショー -->
    <div class="slideshow" id="slideshow">
      <div class="stage">
        <img id="slide-image" alt="" />
        <div class="label" id="slide-label"></div>
      </div>
    </div>

    <div class="notice" id="notice"></div>

    <div class="tools">
      <button type="button" id="fullscreen">全画面</button>
    </div>

    <script type="module" src="./screen.js"></script>
  </body>
</html>
